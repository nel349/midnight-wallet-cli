# Build the native dust-sync sidecar for every target and publish the per-platform
# npm packages + the main package, so an `npm install midnight-wallet-cli` gets the
# fast native cold dust sync (~4.5 min) instead of falling back to WASM (~22 min).
#
# Trigger: push a `v*` tag (after bumping the version + running
# `node scripts/sync-sidecar-versions.mjs`). Or run manually with dry_run to build
# without publishing.
#
# Auth: OIDC trusted publishing (no long-lived secret) once each package has a
# trusted publisher configured on npmjs.com (repo nel349/midnight-wallet-cli,
# this workflow file). Until then — including the very first publish, since a
# trusted publisher can only be attached to a package that already exists — npm
# falls back to the `NPM_TOKEN` repo secret (a classic Automation token). After
# the first release + configuring trusted publishers, that secret can be deleted.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build the binaries but do not publish'
        type: boolean
        default: true

jobs:
  build-sidecar:
    name: build ${{ matrix.pkg }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one platform failing must not block the others (deps are optional)
      matrix:
        include:
          - { os: macos-14,         target: aarch64-apple-darwin,      pkg: darwin-arm64, ext: '' }
          # darwin-x64 cross-compiled on the Apple-Silicon runner (macOS ships the
          # x86_64 SDK). Avoids the scarce/deprecated macos-13 Intel runner, which
          # queues indefinitely; macos-14 has plentiful capacity.
          - { os: macos-14,         target: x86_64-apple-darwin,       pkg: darwin-x64,   ext: '' }
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  pkg: linux-x64,    ext: '' }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, pkg: linux-arm64,  ext: '' }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    pkg: win32-x64,    ext: '.exe' }
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sidecar/dust-sync
      # --locked keeps the ledger crate pins (=8.1.0 etc.) so the serialized
      # DustLocalState round-trips byte-identically with @midnight-ntwrk/ledger-v8.
      - name: Build sidecar
        working-directory: sidecar/dust-sync
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Sanity-check it's the right arch
        if: runner.os != 'Windows'
        run: file "sidecar/dust-sync/target/${{ matrix.target }}/release/dust-sync${{ matrix.ext }}"
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: dust-sync-${{ matrix.pkg }}
          path: sidecar/dust-sync/target/${{ matrix.target }}/release/dust-sync${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish to npm
    needs: build-sidecar
    # Only publish for a real tag push (never for a manual dry run).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mint the OIDC token npm uses for trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - uses: oven-sh/setup-bun@v2
      # OIDC trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.x.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest
      - run: npm ci
      - name: Download all platform binaries
        uses: actions/download-artifact@v4
        with:
          path: /tmp/dust-sync-artifacts
      - name: Stage each binary into its platform package
        shell: bash
        run: |
          set -euo pipefail
          for pkg in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            ext=""; [ "$pkg" = "win32-x64" ] && ext=".exe"
            src="/tmp/dust-sync-artifacts/dust-sync-$pkg/dust-sync$ext"
            dest="packages/dust-sync-$pkg/dust-sync$ext"
            if [ -f "$src" ]; then
              cp "$src" "$dest"; chmod +x "$dest" || true
              echo "staged $pkg"
            else
              echo "::warning::no binary for $pkg — that platform will fall back to WASM"
            fi
          done
      - name: Pin all versions to the tag
        run: node scripts/sync-sidecar-versions.mjs
      # Platform packages MUST publish before the main package, so the main
      # package's optionalDependencies resolve. A platform with no binary this run
      # is skipped (its dir has only package.json) rather than shipping an empty pkg.
      - name: Publish platform packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -uo pipefail
          for pkg in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            ext=""; [ "$pkg" = "win32-x64" ] && ext=".exe"
            if [ -f "packages/dust-sync-$pkg/dust-sync$ext" ]; then
              ( cd "packages/dust-sync-$pkg" && npm publish --access public ) \
                || echo "::warning::publish failed for $pkg (already published at this version?)"
            else
              echo "skipping $pkg — no binary"
            fi
          done
      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
