name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      # The lockfile is committed before a release publishes that version's
      # dust-sync platform packages, so it can't hold them, and once they are
      # on the registry `npm ci` refuses the lockfile for it. CI never needed
      # them (the tests run on the WASM path), so it installs without the pins
      # and puts package.json back.
      - name: Install dependencies
        run: |
          npm pkg delete optionalDependencies
          npm ci
          git checkout package.json

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      # ── Connector package ──

      - name: Connector — Typecheck
        run: npm run typecheck --workspace=packages/connector

      - name: Connector — Build
        run: npm run build --workspace=packages/connector

      - name: Connector — Tests
        run: npm test --workspace=packages/connector

  publish-check:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      # The lockfile is committed before a release publishes that version's
      # dust-sync platform packages, so it can't hold them, and once they are
      # on the registry `npm ci` refuses the lockfile for it. CI never needed
      # them (the tests run on the WASM path), so it installs without the pins
      # and puts package.json back.
      - name: Install dependencies
        run: |
          npm pkg delete optionalDependencies
          npm ci
          git checkout package.json

      - name: Build
        run: npm run build

      - name: Check CLI package
        run: npm pack --dry-run

      - name: Connector — Build
        run: npm run build --workspace=packages/connector

      - name: Check Connector package
        run: npm pack --dry-run --workspace=packages/connector
