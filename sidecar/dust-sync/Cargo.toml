[package]
name = "dust-sync"
version = "0.0.0"
edition = "2021"
publish = false

# Ledger versions MUST stay in lockstep with the CLI's @midnight-ntwrk/ledger-v8
# (serialization compatibility depends on it). See tasks/dust-native-sidecar-plan.md.
[dependencies]
midnight-ledger = "=8.1.0"
midnight-storage = "=1.1.1"
midnight-base-crypto = "=1.0.0"
midnight-serialize = "=1.1.0"
hex = "0.4"

[[bin]]
name = "dust-sync"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
