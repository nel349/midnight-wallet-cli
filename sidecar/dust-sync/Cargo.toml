[package]
name = "dust-sync"
version = "0.0.0"
edition = "2021"
publish = false

# Ledger versions MUST stay in lockstep with the CLI's @midnight-ntwrk/ledger-v8
# (serialization compatibility depends on it). See tasks/dust-native-sidecar-plan.md.
[dependencies]
midnight-ledger = "=8.1.0"
midnight-storage = "=1.1.1"
midnight-base-crypto = "=1.0.0"
midnight-serialize = "=1.1.0"
hex = "0.4"
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3"
zeroize = "1"

[[bin]]
name = "dust-sync"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
